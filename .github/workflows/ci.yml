name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  node:
    name: Node workspaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm --workspace apps/rag-api run test

      - name: Build
        run: npm run build

      - name: Check docs
        run: npm run docs:check

  python:
    name: Eval API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install eval-api
        working-directory: apps/eval-api
        run: pip install -e '.[dev]'

      - name: Lint eval-api
        working-directory: apps/eval-api
        run: ruff check .

      - name: Test eval-api
        working-directory: apps/eval-api
        run: pytest

  docker:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config
