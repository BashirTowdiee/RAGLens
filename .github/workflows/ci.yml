name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  node:
    name: Node workspaces
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: raglens
          POSTGRES_PASSWORD: raglens
          POSTGRES_DB: raglens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raglens -d raglens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://raglens:raglens@localhost:5432/raglens_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm --workspace apps/rag-api run test

      - name: Build
        run: npm run build

      - name: Check docs
        run: npm run docs:check

  python:
    name: Eval API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install eval-api
        working-directory: apps/eval-api
        run: pip install -e '.[dev]'

      - name: Lint eval-api
        working-directory: apps/eval-api
        run: ruff check .

      - name: Test eval-api
        working-directory: apps/eval-api
        run: pytest

      - name: Start eval-api
        working-directory: apps/eval-api
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/raglens-eval-api.log 2>&1 &
          echo $! > /tmp/raglens-eval-api.pid

      - name: Wait for eval-api
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8001/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/raglens-eval-api.log
          exit 1

      - name: Run deterministic CI smoke gate
        working-directory: apps/eval-api
        run: python -m app.ci_smoke_runner --base-url http://127.0.0.1:8001

      - name: Stop eval-api
        if: always()
        run: |
          if [ -f /tmp/raglens-eval-api.pid ]; then
            kill "$(cat /tmp/raglens-eval-api.pid)" || true
          fi

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config

      - name: Build Compose images
        run: docker compose build
